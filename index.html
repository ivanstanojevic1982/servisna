<!DOCTYPE html>
<html lang="sr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9531e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="C3 Aircross">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>C3 Aircross knjižica</title>
<style>
/* jedan ekran: fotografija auta, podsetnici, pa lista servisa */
:root{color-scheme:light;--bg:#f3f1ef;--card:#ffffff;--tx:#1d2027;--mut:#6d6a68;--acc:#d9531e;--accs:#fbe6dc;--bd:#e6e1dd;--ok:#2f7a4c;--oks:#e2f2e8;--warn:#9a6210;--warns:#fbefd7;--bad:#b3261e;--bads:#fbe2df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f2229;--tx:#ecebea;--mut:#a29d99;--acc:#f07a46;--accs:#3a2219;--bd:#2e323b;--ok:#6fcf97;--oks:#1d3326;--warn:#f0b65a;--warns:#3a2d14;--bad:#f28b82;--bads:#3d1f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f2229;--tx:#ecebea;--mut:#a29d99;--acc:#f07a46;--accs:#3a2219;--bd:#2e323b;--ok:#6fcf97;--oks:#1d3326;--warn:#f0b65a;--warns:#3a2d14;--bad:#f28b82;--bads:#3d1f1d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.hero{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--bd)}
.ph{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:3/2;background:#111}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;display:block}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff}
.phbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.more{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;font-weight:700;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.menu{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);min-width:190px}
.menu button,.menu label{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;cursor:pointer;margin:0}
.menu button+label,.menu label+button{border-top:1px solid var(--bd)}
.menu .red{color:var(--bad)}
.phbtn{border:0;margin:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .info{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero h1{margin:0;font-size:20px;letter-spacing:-.2px}
.hero .sub{color:var(--mut);font-size:13px;margin-top:2px}
.plate{font-family:ui-monospace,Menlo,monospace;font-weight:700;border:2px solid var(--tx);border-radius:6px;padding:3px 8px;font-size:15px;white-space:nowrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.rem{display:grid;gap:8px}
.r{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;color:var(--tx);font:inherit}
.r .ic{font-size:22px;width:30px;text-align:center}
.r .m{flex:1;min-width:0}
.r .t{font-weight:600}
.r .v{color:var(--mut);font-size:13px;margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;background:var(--bg);color:var(--mut)}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.warn{background:var(--warns);color:var(--warn)}.pill.bad{background:var(--bads);color:var(--bad)}
.add{background:var(--acc);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px;letter-spacing:0;text-transform:none}
.list{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.s{padding:12px 14px;border-top:1px solid var(--bd);cursor:pointer;display:flex;gap:10px}
.s:first-child{border-top:0}
.s .m{flex:1;min-width:0}
.s .t{font-weight:600;overflow-wrap:anywhere}
.s .v{color:var(--mut);font-size:13px;margin-top:2px}
.s .p{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;padding:12px 14px;background:var(--accs);font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:26px 14px;text-align:center;color:var(--mut)}
.foot{margin-top:26px;text-align:center}
.link{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:2px 0 6px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 5px}
input,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr;gap:0}
.two>div{min-width:0}
input{display:block;min-width:0;max-width:100%;min-height:46px;line-height:1.3}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.kmrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.kmrow .m{flex:1;min-width:0}
.kmrow .t{font-size:13px;color:var(--mut)}
.kmrow .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.kmrow .e{color:var(--acc);font-weight:600;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--acc);color:#fff;margin-top:10px}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .x{position:absolute;top:3px;right:3px;min-width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;padding:0 6px}
.att .x.arm{background:var(--bad);font-size:11px}
.attadd{display:block;margin-top:8px;padding:12px;border:1px dashed var(--bd);border-radius:10px;text-align:center;color:var(--acc);font-weight:600;font-size:15px;cursor:pointer}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.vb{position:absolute;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;line-height:1;transform:translateY(-50%)}
#vClose{transform:none}
#vCnt{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.tset{margin-top:16px;padding:4px 12px 12px;border:1px solid var(--bd);border-radius:12px}
.tset .th{font-weight:600;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:6px 11px;font-size:13px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:30;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {initializeFirestore,getFirestore,persistentLocalCache,persistentSingleTabManager,doc,setDoc,getDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const fbApp=initializeApp({apiKey:"AIzaSyDwdRVgY3xsMtn3Vd3Xqo_gt8rdk0UHr9k",authDomain:"servisna-knjizica-be160.firebaseapp.com",projectId:"servisna-knjizica-be160",storageBucket:"servisna-knjizica-be160.firebasestorage.app",messagingSenderId:"966005060931",appId:"1:966005060931:web:e8adbf424ba964acb36bf6"});
const auth=getAuth(fbApp);
let fs;try{fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentSingleTabManager()})})}catch(e){fs=getFirestore(fbApp)}

const $=s=>document.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtD=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return `${dd}.${m}.${y}.`};
const fmtN=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('sr-RS');

const days=d=>Math.round((new Date(d)-new Date(today()))/864e5);

function blank(){return{plate:'',regDate:'',next:{date:'',km:''},tires:{on:'',next:''},svc:[]}}
let db=norm({});let user=null,mainRef=null,unsub=null,loaded=false;const imgCache=new Map();
function norm(d){d=d||{};const b=blank();for(const k of Object.keys(b))if(d[k]==null)d[k]=b[k];if(!d.next)d.next={date:'',km:''};if(!d.tires)d.tires={on:'',next:''};if(!Array.isArray(d.photos))d.photos=['default'];return d}
const iref=k=>doc(fs,'users',user.uid,'img',k);
const idb={
  get:async k=>{if(imgCache.has(k))return imgCache.get(k);if(!user)return null;try{const s=await getDoc(iref(k));const d=s.exists()?s.data().d:null;if(d)imgCache.set(k,d);return d}catch(e){return null}},
  put:async(k,v)=>{if(!v||v.length>1000000)throw new Error('big');imgCache.set(k,v);setDoc(iref(k),{d:v}).catch(()=>toast('Slika nije sačuvana u bazi'))},
  del:async k=>{imgCache.delete(k);if(user)deleteDoc(iref(k)).catch(()=>{})}
};
function shrink(f,max,q){return new Promise(res=>{const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),W=Math.round(im.naturalWidth*r),H=Math.round(im.naturalHeight*r);
    const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);URL.revokeObjectURL(url);let d=c.toDataURL('image/jpeg',q),qq=q;while(d.length>900000&&qq>0.3){qq-=0.12;d=c.toDataURL('image/jpeg',qq)}res(d)};
  im.onerror=()=>{URL.revokeObjectURL(url);res(null)};im.src=url})}
let galIdx=0,delArm=false;
function renderGal(){
  if(!Array.isArray(db.photos))db.photos=['default'];
  const ph=db.photos.length?db.photos:['default'],def=$('#defImg').src;
  $('#gal').innerHTML=ph.map((s,i)=>`<img alt="Slika ${i+1}" data-k="${s}" src="${s==='default'?def:(imgCache.get(s)||'')}">`).join('');
  ph.forEach(async s=>{if(s==='default'||imgCache.has(s))return;const d=await idb.get(s);const im=document.querySelector(`#gal img[data-k="${s}"]`);if(im&&d)im.src=d});
  $('#dots').innerHTML=ph.length>1?ph.map((_,i)=>`<i class="${i===galIdx?'on':''}"></i>`).join(''):'';
  $('#delPh').hidden=!db.photos.length;delArm=false;$('#delPh').textContent='🗑 Obriši ovu sliku';
  const g=$('#gal');galIdx=Math.min(galIdx,ph.length-1);g.scrollLeft=galIdx*g.clientWidth;
}
function save(){if(!mainRef)return;setDoc(mainRef,JSON.parse(JSON.stringify(db))).catch(e=>toast('Nije sačuvano u bazi ('+(e.code||'greška')+')'))}
const curKm=()=>db.km?Number(db.km):Math.max(0,...db.svc.map(s=>Number(s.km)||0));

function status(date,km){
  if(!date&&!km)return['','Nije uneto'];
  const k=curKm();let st='ok',txt='';
  if(date){const d=days(date);txt=d<0?`kasni ${-d} d`:d===0?'danas':`za ${d} d`;if(d<0)st='bad';else if(d<=30)st='warn'}
  if(km&&k){const r=Number(km)-k;if(r<=0)st='bad';else if(r<=1000&&st!=='bad')st='warn';if(!date)txt=r<=0?'prešao km':`još ${fmtN(r)} km`}
  return[st,txt||'u redu'];
}

function render(){
  renderGal();
  const k=curKm();
  $('#kmTxt').textContent=db.kmDate?'km upisani '+fmtD(db.kmDate):'Servisna knjižica';
  $('#kmNum').textContent=k?fmtN(k)+' km':'Nije upisana';
  $('#plateTxt').hidden=!db.plate;$('#plateTxt').textContent=db.plate;
  const reg=status(db.regDate),nx=status(db.next.date,db.next.km),ti=status(db.tires.next);
  const row=(id,ic,t,v,[st,txt])=>`<button class="r" data-open="${id}"><span class="ic">${ic}</span><span class="m"><div class="t">${t}</div><div class="v">${v}</div></span><span class="pill ${st}">${txt}</span></button>`;
  $('#rem').innerHTML=
    row('reg','📄','Registracija',db.regDate?'ističe '+fmtD(db.regDate):'Dodirni da upišeš datum',reg)+
    row('next','🔧','Sledeći servis',[db.next.date&&fmtD(db.next.date),db.next.km&&'na '+fmtN(db.next.km)+' km'].filter(Boolean).join(' · ')||'Dodirni da upišeš',nx)+
    row('tires','🛞','Gume',(db.tires.on?'Na autu: '+db.tires.on+tireInfo(db.tires.on):'Nije upisano')+(db.tires.next?' · zamena '+fmtD(db.tires.next):''),ti);
  const list=[...db.svc].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=db.svc.reduce((a,s)=>a+(Number(s.price)||0),0);
  $('#svc').innerHTML=list.length?list.map(s=>`<div class="s" data-svc="${s.id}"><div class="m"><div class="t">${esc(s.what||'Servis')}</div><div class="v">${fmtD(s.date)}${s.km?' · '+fmtN(s.km)+' km':''}${s.att&&s.att.length?' · 📎 '+s.att.length:''}</div>${s.note?`<div class="v" style="white-space:pre-line;margin-top:4px">${esc(s.note)}</div>`:''}</div>${s.price?`<div class="p">${fmtN(s.price)} din</div>`:''}</div>`).join('')+`<div class="total"><span>Ukupno potrošeno</span><span>${fmtN(total)} din</span></div>`
    :`<div class="empty">Još nema upisanih servisa.<br>Dodaj prvi dugmetom ＋ Dodaj.</div>`;
}

/* ---- sheet ---- */
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').hidden=false;$('#sheet').scrollTop=0}
let cleanup=null;
function closeSheet(){$('#ov').hidden=true;if(cleanup){cleanup();cleanup=null}}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
const btns=(del)=>`<button class="btn" data-act="save">Sačuvaj</button>${del?'<button class="btn del" data-act="del">Obriši</button>':''}<button class="btn sec" data-act="cancel">Otkaži</button>`;
let onSave=null,onDel=null;
$('#sheet').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='save')onSave&&onSave();
  else if(act==='cancel')closeSheet();
  else if(act==='del'){a.outerHTML='<button class="btn del" data-act="del2">Sigurno obriši</button>'}
  else if(act==='del2')onDel&&onDel();
  else if(act==='fill'){$('#'+a.dataset.t).value=a.textContent}
  else if(act==='seg'){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===a));showSet(a.dataset.val)}
  else if(act==='copy')copyBk();
  else if(act==='imp')importBk(false);
  else if(act==='imp2')importBk(true);
  else if(act==='fsave')fullBackup();
  else if(act==='frestore')fullRestore();
});
const v=id=>$('#'+id).value.trim();

function editSvc(id){
  const s=id?db.svc.find(x=>x.id===id):{date:today()};
  let att=[...(s.att||[])];const added=[],removed=[];
  openSheet(`<h3>${id?'Izmena servisa':'Novi servis'}</h3>
  <label for="s_what">Šta je urađeno</label><input id="s_what" value="${esc(s.what)}" placeholder="npr. Mali servis">
  <div class="chips">${['Mali servis','Veliki servis','Ulje i filteri','Kočnice','Zamena guma','Akumulator','Registracija','Popravka'].map(t=>`<button type="button" data-act="fill" data-t="s_what">${t}</button>`).join('')}</div>
  <div class="two"><div><label for="s_date">Datum</label><input type="date" id="s_date" value="${esc(s.date)}"></div>
  <div><label for="s_km">Kilometraža</label><input type="number" inputmode="numeric" id="s_km" value="${esc(s.km)}"></div></div>
  <label for="s_price">Cena (din)</label><input type="number" inputmode="decimal" id="s_price" value="${esc(s.price)}">
  <label for="s_note">Napomena (gde, šta je menjano…)</label><textarea id="s_note">${esc(s.note)}</textarea>
  <label>Prilozi (račun, papir od majstora)</label>
  <div class="atts" id="atts"></div>
  <label class="attadd" for="attIn">📎 Dodaj sliku papira</label><input type="file" id="attIn" accept="image/*" multiple hidden>
  ${btns(!!id)}`);
  const drawAtts=async()=>{const box=$('#atts');if(!box)return;
    box.innerHTML=att.map(a=>`<div class="att" data-a="${a}"><img alt="Prilog"><button type="button" class="x" data-x="${a}" aria-label="Ukloni">×</button></div>`).join('');
    for(const a of att){const d=await idb.get(a);const im=box.querySelector(`[data-a="${a}"] img`);if(im&&d)im.src=d}};
  drawAtts();
  $('#atts').onclick=e=>{const x=e.target.closest('[data-x]');if(x){e.stopPropagation();const k=x.dataset.x;
      if(!x.classList.contains('arm')){x.classList.add('arm');x.textContent='Ukloni?';return}
      att=att.filter(a=>a!==k);removed.push(k);drawAtts();return}
    const t=e.target.closest('[data-a]');if(t)viewAtt(att,att.indexOf(t.dataset.a))};
  $('#attIn').onchange=async e=>{const files=[...e.target.files];e.target.value='';
    for(const f of files){const d=await shrink(f,1500,0.72);if(!d){toast('Slika ne može da se otvori');continue}
      const k='a'+uid();try{await idb.put(k,d)}catch(err){toast('Nema mesta za još slika');break}att.push(k);added.push(k)}
    drawAtts()};
  cleanup=()=>added.forEach(k=>idb.del(k));
  onSave=()=>{const o={what:v('s_what'),date:v('s_date'),km:v('s_km'),price:v('s_price'),note:v('s_note'),att};
    if(!o.what&&!o.price)return toast('Upiši šta je urađeno');
    if(id){const c=db.svc.find(x=>x.id===id);if(c)Object.assign(c,o);else db.svc.push({id,...o})}else db.svc.push({id:uid(),...o});if(Number(o.km)>curKm()){db.km=o.km;db.kmDate=o.date||today()}
    removed.forEach(k=>idb.del(k));cleanup=null;save();closeSheet();render();toast('Sačuvano')};
  onDel=()=>{(s.att||[]).concat(added).forEach(k=>idb.del(k));cleanup=null;db.svc=db.svc.filter(x=>x.id!==id);save();closeSheet();render();toast('Obrisano')};
}
function viewAtt(list,i){
  const v=$('#viewer');v.hidden=false;let k=i;
  const show=async()=>{$('#vImg').src=(await idb.get(list[k]))||'';$('#vCnt').textContent=list.length>1?`${k+1} / ${list.length}`:'';
    $('#vPrev').hidden=k<=0;$('#vNext').hidden=k>=list.length-1};
  $('#vPrev').onclick=()=>{k--;show()};$('#vNext').onclick=()=>{k++;show()};
  $('#vClose').onclick=()=>{v.hidden=true;$('#vImg').src=''};show();
}
function editKm(){
  openSheet(`<h3>Trenutna kilometraža</h3>
  <label for="k_km">Kilometraža sa sata</label><input type="number" inputmode="numeric" id="k_km" value="${esc(curKm()||'')}">${btns()}`);
  setTimeout(()=>{const i=$('#k_km');i.focus();i.select()},50);
  onSave=()=>{const n=v('k_km');if(n&&isNaN(n))return toast('Upiši samo broj');db.km=n;db.kmDate=n?today():'';save();closeSheet();render();toast('Sačuvano')};
}
function editReg(){
  openSheet(`<h3>Registracija</h3>
  <label for="g_plate">Registarske tablice</label><input id="g_plate" value="${esc(db.plate)}" placeholder="BG 123-AB" autocapitalize="characters">
  <label for="g_date">Registracija ističe</label><input type="date" id="g_date" value="${esc(db.regDate)}">${btns()}`);
  onSave=()=>{db.plate=v('g_plate').toUpperCase();db.regDate=v('g_date');save();closeSheet();render();toast('Sačuvano')};
}
function editNext(){
  openSheet(`<h3>Sledeći servis</h3>
  <div class="two"><div><label for="n_date">Datum</label><input type="date" id="n_date" value="${esc(db.next.date)}"></div>
  <div><label for="n_km">Na kilometraži</label><input type="number" inputmode="numeric" id="n_km" value="${esc(db.next.km)}"></div></div>
  <p style="color:var(--mut);font-size:13px">Upiši datum, kilometražu ili oba. Pre roka dobijaš oznaku „za X d“, a kad prođe, „kasni“.</p>${btns()}`);
  onSave=()=>{db.next={date:v('n_date'),km:v('n_km')};save();closeSheet();render();toast('Sačuvano')};

function tireInfo(k){const t=db.tires[k];if(!t)return'';const s=[t.brand,t.size].filter(Boolean).join(' ');return s?' ('+esc(s)+')':''}
function showSet(k){document.querySelectorAll('.tset').forEach(d=>d.hidden=!!k&&d.dataset.set!==k)}

  <div class="seg"><button type="button" data-act="seg" data-val="letnje" class="${db.tires.on==='letnje'?'on':''}">☀️ Letnje</button><button type="button" data-act="seg" data-val="zimske" class="${db.tires.on==='zimske'?'on':''}">❄️ Zimske</button></div>
  <label for="t_next">Sledeća zamena</label><input type="date" id="t_next" value="${esc(db.tires.next)}">

  ${btns()}`);
  showSet(db.tires.on);
  onSave=()=>{const on=document.querySelector('.seg .on');db.tires={on:on?on.dataset.val:'',next:v('t_next'),letnje:{brand:v('t_lb'),size:v('t_ls')},zimske:{brand:v('t_zb'),size:v('t_zs')}};save();closeSheet();render();toast('Sačuvano')};

function backup(){
  openSheet(`<h3>Rezervna kopija</h3>
  <div><p style="color:var(--mut);font-size:14px;margin:0">Jedan fajl sa svim podacima, slikama auta i prilozima servisa. Sačuvaj ga u Files / iCloud Drive / Google Drive.</p>
  <button class="btn" data-act="fsave">Sačuvaj kopiju u fajl</button>
  <label class="attadd" for="fIn" style="margin-top:10px">Vrati iz fajla</label><input type="file" id="fIn" accept=".json,application/json,text/plain" hidden>
  <div id="fMsg" style="font-size:13px;color:var(--mut);margin-top:6px"></div></div>
  <button class="btn sec" data-act="cancel">Zatvori</button>`);
  $('#fIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const d=JSON.parse(await f.text());if(!d.data||!d.data.svc)throw 0;pendingFull=d;
      $('#fMsg').innerHTML=`Fajl od ${esc(fmtD((d.made||'').slice(0,10)))}: ${d.data.svc.length} servisa, ${Object.keys(d.att||{}).length} priloga.<button class="btn del" data-act="frestore">Zameni sve podatke ovim fajlom</button>`}
    catch(err){toast('Ovo nije ispravan fajl kopije')}};
}
let pendingFull=null;
async function fullBackup(){
  toast('Pripremam kopiju…');
  const att={};for(const k of db.svc.flatMap(s=>s.att||[]).concat(db.photos.filter(p=>p!=='default'))){const d=await idb.get(k);if(d)att[k]=d}
  const json=JSON.stringify({app:'c3aircross',made:new Date().toISOString(),data:db,att});
  const name=`C3-Aircross-kopija-${today()}.json`;
  const file=new File([json],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Kopija preuzeta')}
  catch(e){toast('Čuvanje fajla radi u instaliranoj aplikaciji')}
}
async function fullRestore(){
  const d=pendingFull;if(!d)return;closeSheet();toast('Prebacujem podatke…');
  await importAll(JSON.parse(JSON.stringify(d.data)),d.att||{});toast('Sve vraćeno')
}
async function importAll(data,att){
  data=norm(data);
  data.photos=await Promise.all(data.photos.map(async p=>{if(typeof p==='string'&&p.startsWith('data:')){const k='p'+uid();await idb.put(k,p);return k}return p}));
  for(const [k,v] of Object.entries(att)){try{await idb.put(k,v)}catch(e){}}
  delete data.seed1;delete data.photo;db=data;galIdx=0;save();render();
}
function copyBk(){const t=JSON.stringify(db);const fb=()=>{const a=$('#bk');a.focus();a.select();toast('Tekst je označen, kopiraj ga')};
  try{navigator.clipboard.writeText(t).then(()=>toast('Kopirano')).catch(fb)}catch(e){fb()}}
let pending=null;
function importBk(ok){
  if(!ok){try{const d=JSON.parse($('#paste').value);if(!d.svc)throw 0;pending=d}catch(e){return toast('Nalepljeni tekst nije ispravna kopija')}
    const b=document.querySelector('[data-act="imp"]');b.outerHTML='<button class="btn del" data-act="imp2">Zameni sve podatke ovom kopijom</button>';return}
  db=pending;save();closeSheet();render();toast('Podaci vraćeni');
}

$('#addSvc').onclick=()=>editSvc();
$('#kmBtn').onclick=editKm;
$('#gal').addEventListener('scroll',()=>{const g=$('#gal'),i=Math.round(g.scrollLeft/g.clientWidth);if(i!==galIdx){galIdx=i;delArm=false;$('#phMenu').hidden=true;$('#delPh').textContent='🗑 Obriši ovu sliku';document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i))}},{passive:true});
$('#moreBtn').onclick=e=>{e.stopPropagation();const m=$('#phMenu');m.hidden=!m.hidden;delArm=false;$('#delPh').textContent='🗑 Obriši ovu sliku'};
$('#addPh').addEventListener('click',()=>{setTimeout(()=>$('#phMenu').hidden=true,300)});
document.addEventListener('click',e=>{if(!e.target.closest('.phbar'))$('#phMenu').hidden=true});
$('#delPh').onclick=e=>{e.stopPropagation();
  if(!delArm){delArm=true;$('#delPh').textContent='Dodirni opet za brisanje';return}
  $('#phMenu').hidden=true;const gone=db.photos.splice(galIdx,1)[0];if(gone&&gone!=='default')idb.del(gone);galIdx=Math.max(0,galIdx-1);save();renderGal();toast('Slika obrisana');
};
function loadImg(f){return new Promise(res=>{const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const W=Math.min(900,im.naturalWidth),H=Math.round(im.naturalHeight*W/im.naturalWidth);
    const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.75))};
  im.onerror=()=>{URL.revokeObjectURL(url);res(null)};im.src=url})}
$('#photoIn').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  let added=0,full=false;
  for(const f of files){const d=await loadImg(f);if(!d)continue;const k='p'+uid();try{await idb.put(k,d)}catch(err){full=true;continue}db.photos.push(k);added++}
  save();
  galIdx=db.photos.length-1;renderGal();
  toast(full?`Dodato ${added}, neke slike su prevelike`:added===1?'Slika dodata':`Dodato slika: ${added}`);
});
$('#bkBtn').onclick=backup;
$('#outBtn').onclick=()=>{if($('#outBtn').dataset.arm){signOut(auth)}else{$('#outBtn').dataset.arm=1;$('#outBtn').textContent='Dodirni opet za odjavu'}};
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lgBtn');b.disabled=true;b.textContent='Prijavljujem…';$('#lgErr').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#lgMail').value.trim(),$('#lgPass').value)}
  catch(err){$('#lgErr').textContent=({'auth/invalid-credential':'Pogrešan mejl ili lozinka.','auth/wrong-password':'Pogrešna lozinka.','auth/user-not-found':'Ne postoji nalog sa tim mejlom.','auth/too-many-requests':'Previše pokušaja, sačekaj malo.','auth/network-request-failed':'Nema interneta. Za prvu prijavu treba internet.'})[err.code]||('Prijava nije uspela ('+err.code+')')}
  b.disabled=false;b.textContent='Prijavi se'});
$('#lgForgot').onclick=async()=>{const m=$('#lgMail').value.trim();if(!m)return $('#lgErr').textContent='Prvo upiši mejl, pa dodirni ponovo.';
  try{await sendPasswordResetEmail(auth,m);$('#lgErr').textContent='Poslat je mejl za novu lozinku.'}catch(e){$('#lgErr').textContent='Slanje nije uspelo ('+e.code+')'}};
function oldIdbGet(k){return new Promise(res=>{try{const r=indexedDB.open('c3prilozi',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');
  r.onsuccess=()=>{try{const t=r.result.transaction('img','readonly').objectStore('img').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}
function offerLocal(){let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!loc||!loc.svc||localStorage.getItem(KEY+'_moved'))return;
  openSheet(`<h3>Prebaci podatke u bazu?</h3><p style="color:var(--mut);font-size:14px">Na ovom telefonu postoje podaci iz ranije verzije: ${loc.svc.length} servisa. Prebaci ih u bazu, sa slikama i prilozima.</p>
  <button class="btn" data-act="move">Prebaci sada</button><button class="btn sec" data-act="cancel">Ne sada</button>`);
  pendingLocal=loc}
let pendingLocal=null;
$('#sheet').addEventListener('click',async e=>{if(!e.target.closest('[data-act="move"]')||!pendingLocal)return;closeSheet();toast('Prebacujem…');
  const att={};for(const k of pendingLocal.svc.flatMap(s=>s.att||[])){const d=await oldIdbGet(k);if(d)att[k]=d}
  await importAll(pendingLocal,att);try{localStorage.setItem(KEY+'_moved','1')}catch(e){}pendingLocal=null;toast('Podaci su u bazi')});
onAuthStateChanged(auth,u=>{
  user=u;if(unsub){unsub();unsub=null}imgCache.clear();
  $('#login').hidden=!!u;$('#boot').hidden=true;
  if(!u){mainRef=null;db=norm({});loaded=false;return}
  $('#who').textContent=u.email||'';$('#outBtn').textContent='Odjavi se';delete $('#outBtn').dataset.arm;
  mainRef=doc(fs,'users',u.uid,'data','main');
  unsub=onSnapshot(mainRef,s=>{db=norm(s.exists()?s.data():{});const first=!loaded;loaded=true;render();
      if(first&&!s.exists())offerLocal()},
    err=>toast('Baza nije dostupna ('+err.code+')'));
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

</body></html>
